workflows:
  ios-app-store:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic_appstore
    environment:
      groups:
        - kdm_runtime
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kurandakimesaj.app
      vars:
        BUNDLE_ID: com.kurandakimesaj.app
        APP_STORE_APPLE_ID: "6782974088"
      flutter: 3.44.2
      xcode: 26.4
      cocoapods: default
    scripts:
      # sqlite3 3.x derleme kancası hazır kitaplığı GitHub sürümlerinden indirir;
      # GitHub kesintisinde (2026-11-08, "timeouts for some unauthenticated users")
      # hata sayfasını indirip "Hash of downloaded file ... expected ..." ile
      # derlemeyi düşürüyor. Apple platformlarında işletim sisteminin SQLite'ı
      # var ve paket eski sürümleri sürüm kontrolüyle destekliyor; uygulama özel
      # SQLite özelliği (FTS/JSON/RETURNING) kullanmıyor. Ayar YALNIZ bu Mac
      # makinesinde (macOS test + iOS IPA) geçerli; Android derlemesine gitmez,
      # çünkü user_defines tüm platformlara uygulanır ve Android'de sistem
      # SQLite'ı uygulamalara açık değil.
      - name: SQLite = Apple sistem kitaplığı (GitHub indirmesi yok)
        script: |
          printf '\nhooks:\n  user_defines:\n    sqlite3:\n      source: system\n' >> pubspec.yaml
          tail -6 pubspec.yaml
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.4 \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
